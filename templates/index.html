<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_name }}</title>
    <style>
      body { font-family: system-ui, -apple-system, Arial, sans-serif; margin: 2rem; }
      form, table { max-width: 800px; }
      .row { display: flex; gap: 8px; margin: 6px 0; }
      input, select, textarea { padding: 6px 8px; }
      button { padding: 8px 12px; cursor: pointer; }
      table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
      th, td { border: 1px solid #ddd; padding: 8px; }
      th { background: #f6f6f6; text-align: left; }
    </style>
  </head>
  <body>
    <h1>{{ app_name }}</h1>

    <h2>Добавить транзакцию</h2>
    <form method="post" action="{{ url_for('add') }}">
      <div class="row">
        <label>Дата:
          <input type="date" name="tx_date" required />
        </label>
        <label>Тип:
          <select name="kind" required>
            <option value="income">Доход</option>
            <option value="expense">Расход</option>
          </select>
        </label>
        <label>Категория:
          <input type="text" name="category" placeholder="Напр. Food" />
        </label>
        <label>Сумма:
          <input type="number" step="0.01" name="amount" required />
        </label>
      </div>
      <div class="row">
        <label style="flex:1">Заметка:
          <input type="text" name="note" placeholder="необязательно" />
        </label>
      </div>
      <button type="submit">Добавить</button>
      <div>
        <lable>Azamat!
          <input type="text" name="test">
        </lable>
      </div>

    </form>

    <h2>Список транзакций</h2>
    {% if txs %}
      <table>
        <tr>
          <th>Дата</th><th>Тип</th><th>Категория</th><th>Сумма</th><th>Заметка</th>
        </tr>
        {% for t in txs %}
        <tr>
          <td>{{ t['tx_date'] }}</td>
          <td>{{ t['kind'] }}</td>
          <td>{{ t['category'] }}</td>
          <td>{{ '%.2f'|format(t['amount']) }}</td>
          <td>{{ t['note'] }}</td>
        </tr>
        {% endfor %}
      </table>
    {% else %}
      <p>Транзакций пока нет.</p>
    {% endif %}
  </body>
</html>
