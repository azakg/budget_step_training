  <body class="bg-light, p-4">

      </div>

        <div class="col-4 bg-info text-white">Ширина 3</div>

      </div>
      <div class="row">
          <div class="col-12 col-md-6 bg-primary">Левый</div>

      </div>

    </div>

  </body>
</html>
