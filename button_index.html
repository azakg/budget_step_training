<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Пример Bootstrap</title>

    <!-- Подключаем Bootstrap 5 по CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
  </head>
  <body class="p-4">

    <h1 class="text-primary">Привет, Bootstrap!</h1>
    <p>Это обычный абзац без стилей.</p>
    <p class="text-success">А это зелёный текст.</p>

    <button class="btn btn-primary">Главная кнопка</button>
    <button class="btn btn-danger">Красная кнопка</button>
    <button class="btn btn-success">Зелёная кнопка</button>
    <button class="btn btn-warning">Жёлтая кнопка</button>
    <p style="color: #ff6600;">Оранжевый текст через HEX</p>

  </body>
</html>
